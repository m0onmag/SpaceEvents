# Часовой пояс для расписания
timezone: 'Europe/Moscow'

# Максимум пропущенных минут (из-за лагов), которые плагин догоняет и запускает ивенты задним числом
max-catch-up-minutes: 5

# Проверка обновлений на GitHub при запуске: true - проверять, false - выключить
update-checker: true

# Статистика bStats: true - отправлять, false - выключить
metrics: true

# Логи в консоль: true - писать, false - молчать
log: true

# Ивенты. Время обязательно в кавычках ('12:00'), иначе yaml прочитает его как число.
# Дни: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY или ALL (каждый день).
events:
  # Название ивента
  death_chest:
    # Включен ли ивент
    enabled: true
    # Команда запуска ивента
    command: 'bair start death_chest'      # одна команда
    # Время запуска
    schedule:
      MONDAY: ['14:00', '20:00']
      WEDNESDAY: ['14:00', '20:00']
      FRIDAY: ['14:00', '20:00']
      SATURDAY: ['12:00', '16:00', '20:00']
      SUNDAY: ['12:00', '16:00', '20:00']
  boss:
    enabled: true
    commands:                              # или несколько команд
      - 'boss start example'
    schedule:
      ALL: ['12:00', '16:00']

messages:
  prefix: "&6Ивенты &7» "
  no-permission: "&cНедостаточно прав."
  usage: "&fИспользование&7: &6/{label} next, list, run, reload"
  reloaded: "&aКонфиг перезагружен. Ивентов: {count}"
  no-next: "&cЗапланированных ивентов нет."
  next: "&fБлижайший ивент&7: &6{name}&f через &6{time}"
  list-empty: "&cИвентов нет."
  list-entry: "&f{name}&7 [{state}&7] {slots}"
  state-on: "&aвкл"
  state-off: "&cвыкл"
  no-schedule: "&cбез расписания"
  run-usage: "&fИспользование&7: &6/spaceevents run ивент"
  event-not-found: "&cИвент не найден: {name}"
  event-started: "&aИвент запущен: {name}"
  placeholder-none: "нет"

  # Форматы времени до ивента ({d} дни, {h} часы, {m} минуты, {s} секунды)
  time-days: "{d}д {h}ч {m}м"
  time-hours: "{h}ч {m}м {s}с"
  time-minutes: "{m}м {s}с"

  # Сообщения в консоль (без цветов)
  log-event-started: "Запущен ивент: {name}"
  log-command-error: "Ивент '{name}': ошибка команды '{command}': {error}"
  log-bad-zone: "Неверный или не указан timezone '{zone}' в config.yml (пример: Europe/Moscow)."
  reload-failed: "Ошибка перезагрузки: {error}"
  log-bad-section: "Ивент '{name}': неверная секция, пропуск."
  log-no-commands: "Ивент '{name}': не указаны команды, пропуск."
  log-bad-day: "Ивент '{name}': неизвестный день '{day}'."
  log-bad-time: "Ивент '{name}': неверное время '{time}' (формат HH:mm, пишите в кавычках)."
  log-no-schedule: "Ивент '{name}': расписания нет, запуск только через /spaceevents run."